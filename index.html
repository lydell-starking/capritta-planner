<title>Damage & Return Action Tree — Capritta Fine Appliance</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Bebas+Neue&display=swap');
:root {
  --bg:#f5f3ef;--bg2:#e8e2d8;--bg3:#d4c9b8;--ink:#1a1a1a;--ink2:#3a3a3a;--ink3:#5a5a5a;
  --border:#c0b8a8;--green:#1e6b3a;--green-bg:#e8f5ee;--amber:#8a6a1a;--amber-bg:#fdf3dc;
  --red:#8b2020;--red-bg:#faeaea;--blue:#2a6096;--blue-bg:#e8f0f8;--accent:#8b2020;
  --purple:#5B2A8B;--purple-bg:#F0EBF9;--gold:#8a6a1a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--ink);min-height:100vh}
.header{background:#0a1628;color:#f5f3ef;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:18px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:#c9a84c}
.header-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a9bb0;margin-top:2px}
.role-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #8a9bb0;color:#8a9bb0;cursor:pointer}
.role-badge:hover{border-color:#c9a84c;color:#c9a84c}
.container{max-width:680px;margin:0 auto;padding:2rem 1.5rem 4rem}
.breadcrumb{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3);margin-bottom:1.75rem;flex-wrap:wrap}
.breadcrumb .sep{color:var(--border)}
.breadcrumb .current{color:var(--ink);font-weight:500}
.breadcrumb span{cursor:pointer}
.breadcrumb span:hover{color:var(--ink)}
.step-card{background:white;border:1px solid var(--border);border-radius:12px;padding:1.75rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.step-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-bottom:.6rem}
.step-q{font-size:20px;font-weight:600;line-height:1.2;margin-bottom:.6rem;color:var(--ink);font-family:'Bebas Neue',sans-serif;letter-spacing:.5px}
.step-hint{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:1.5rem}
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{display:flex;align-items:flex-start;gap:12px;padding:.9rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;font-family:'IBM Plex Mono',monospace;transition:all .15s;width:100%}
.opt-btn:hover{background:white;border-color:var(--ink2);transform:translateX(2px)}
.opt-btn .opt-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--bg2)}
.opt-btn .opt-text{flex:1}
.opt-btn .opt-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.opt-btn .opt-desc{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.4}
.opt-btn.urgent{border-color:#E8A87C;background:#FEF7F3}
.opt-btn.urgent:hover{border-color:var(--accent)}
.opt-btn.urgent .opt-icon{background:#FAEDE8}
.opt-btn.good{border-color:#8DC9AA;background:var(--green-bg)}
.opt-btn.good:hover{border-color:var(--green)}
.opt-btn.good .opt-icon{background:#C8E8D8}
/* Role picker cards */
.role-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:1.5rem}
@media(max-width:520px){.role-cards{grid-template-columns:1fr}}
.role-card{background:white;border:2px solid var(--border);border-radius:14px;padding:1.5rem 1rem;cursor:pointer;text-align:center;transition:all .2s;font-family:'IBM Plex Mono',monospace}
.role-card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.role-card.delivery{border-top:4px solid #8b2020}
.role-card.warehouse{border-top:4px solid #2a6096}
.role-card.tech{border-top:4px solid var(--purple)}
.role-card .rc-icon{font-size:28px;margin-bottom:.65rem}
.role-card .rc-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:.3rem}
.role-card .rc-desc{font-size:12px;color:var(--ink3);line-height:1.4}
/* Vendor lookup grid */
.vendor-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vendor-btn{padding:.7rem .85rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;text-align:left;font-family:'IBM Plex Mono',monospace;transition:all .15s}
.vendor-btn:hover{background:white;border-color:var(--ink2)}
.vendor-btn .vn{font-size:13px;font-weight:500;color:var(--ink)}
.vendor-btn .vb{font-size:11px;color:var(--ink3);margin-top:1px}
.info-card{border-radius:10px;padding:1rem 1.1rem;margin-bottom:.65rem;border:1px solid var(--border);background:white}
.info-card.red{border-left:3px solid var(--accent);background:var(--red-bg)}
.info-card.amber{border-left:3px solid #D4950A;background:var(--amber-bg)}
.info-card.green{border-left:3px solid var(--green);background:var(--green-bg)}
.info-card.blue{border-left:3px solid var(--blue);background:var(--blue-bg)}
.info-card.purple{border-left:3px solid var(--purple);background:var(--purple-bg)}
.info-card.neutral{border-left:3px solid var(--ink3)}
.ic-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:.45rem;font-weight:500}
.red .ic-label{color:var(--red)}.amber .ic-label{color:var(--amber)}.green .ic-label{color:var(--green)}
.blue .ic-label{color:var(--blue)}.purple .ic-label{color:var(--purple)}.neutral .ic-label{color:var(--ink3)}
.ic-body{font-size:13px;line-height:1.65;color:var(--ink)}
.steps-list{list-style:none;padding:0;counter-reset:step-counter}
.steps-list li{padding:.35rem 0 .35rem 1.6rem;position:relative;font-size:13px;line-height:1.5;color:var(--ink);border-bottom:.5px solid var(--border)}
.steps-list li:last-child{border-bottom:none}
.steps-list li::before{content:counter(step-counter);counter-increment:step-counter;position:absolute;left:0;top:.38rem;width:18px;height:18px;background:var(--ink);color:white;border-radius:50%;font-size:10px;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;font-weight:500}
.steps-list li.warn::before{background:var(--accent)}
.responsible{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);font-family:'IBM Plex Mono',monospace;margin-bottom:.65rem;flex-wrap:wrap}
.responsible .r-tag{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--ink2);font-size:11px}
.contact-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.65rem .85rem;font-size:12px;margin-top:.5rem;line-height:1.6}
.contact-box .label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-family:'IBM Plex Mono',monospace;margin-bottom:.2rem}

function ejsCounterKey(){
  const d=new Date();
  return `ejs_count_${d.getFullYear()}_${d.getMonth()+1}`;
}
function ejsInitCounter(){
  const key=ejsCounterKey();
  const used=parseInt(localStorage.getItem(key)||'0');
  const el=document.getElementById('ejs-counter');
  const usedEl=document.getElementById('ejs-used');
  if(el&&usedEl){
    usedEl.textContent=used;
    el.style.display='block';
    const pct=used/200;
    el.style.color=pct>=0.9?'#c9a84c':pct>=0.75?'#8a9bb0':'#8a9bb0';
    if(pct>=0.9) el.style.color='#e8a030';
    if(used>=200) el.style.color='#8b2020';
  }
}
function ejsIncrementCounter(){
  const key=ejsCounterKey();
  const used=parseInt(localStorage.getItem(key)||'0')+1;
  localStorage.setItem(key,used);
  ejsInitCounter();
}

// ── IMAGE COMPRESSION ──
// Resizes to max 1600px, JPEG 0.75 — keeps files ~300-500KB for email
async function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=800;
      let w=img.width, h=img.height;
      if(w>MAX||h>MAX){
        if(w>h){h=Math.round(h*MAX/w);w=MAX;}
        else{w=Math.round(w*MAX/h);h=MAX;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        URL.revokeObjectURL(url);
        const reader=new FileReader();
        reader.onload=e=>resolve({
          name: file.name||`photo-${Date.now()}.jpg`,
          data: e.target.result.split(',')[1], // base64 only
          content_type:'image/jpeg'
        });
        reader.readAsDataURL(blob);
      },'image/jpeg',0.55);
    };
    img.src=url;
  });
}

// ── SEND VIA EMAILJS ──
async function ejsSend({subject, message, photos, ccField, btn, successMsg}){
  btn.disabled=true;

  // Warn if no photos
  if(!photos || photos.length===0){
    const proceed=confirm('No photos attached. Warranty may not be able to process this without photos. Send anyway?');

  }

  btn.textContent='📤 Compressing photos…';

  // Build inline photo HTML
  let photoHtml='';
  if(photos && photos.length){
    const compressed=await Promise.all(photos.map(f=>compressImage(f)));

      `<div style="margin:12px 0">
        <div style="font-size:11px;color:#666;margin-bottom:4px">Photo ${i+1}</div>
        <img src="data:image/jpeg;base64,${p.data}" style="max-width:100%;border:1px solid #ddd;border-radius:4px">
      </div>`
    ).join('');
  }

  // Build full HTML message
  const htmlMessage=`<pre style="font-family:monospace;font-size:13px;white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:4px">${message}</pre>${photoHtml}`;

  btn.textContent='📤 Sending…';
  try{
    await emailjs.send(EJS.serviceId, EJS.templateId, {
      to_email: EMAIL_TO,
      cc_email: ccField||'',
      subject:  subject,
      message:  htmlMessage,
    });
    btn.textContent=successMsg||'✓ Sent to Warranty';
    btn.style.background='var(--green)';
    btn.style.color='white';
    btn.disabled=false;
    // Update usage counter
    ejsIncrementCounter();
  }catch(err){
    console.error('EmailJS error',err);
    const msg=err?.text||err?.message||JSON.stringify(err)||'Unknown error';
    btn.textContent=`⚠ Failed: ${msg.slice(0,60)} — tap to retry`;
    btn.style.background='var(--red)';
    btn.style.color='white';
    btn.disabled=false;
  }
}

// ── STATE ──
let state={role:null,step:'role_pick',vendor:null,scenario:null,history:[]};

// ── NAVIGATION ──
function go(step,vendor=null){
  state.history.push({step:state.step,vendor:state.vendor,scenario:state.scenario});
  state.step=step;
  if(vendor!==null)state.vendor=vendor;
  render();
}
function back(){
  if(!state.history.length)return;
  const p=state.history.pop();
  state.step=p.step;state.vendor=p.vendor;state.scenario=p.scenario;render();
}
function reset(){state={role:null,step:'role_pick',vendor:null,scenario:null,history:[]};render();}
function setRole(r){
  state.role=r;
  state.scenario=null;
  state.history=[];
  if(r==='delivery') state.step='del_situation';
  else if(r==='warehouse') state.step='wh_situation';
  else if(r==='tech') state.step='tech_report';
  else state.step='warranty_scenario';
  render();
}
function setScenario(s){
  state.history.push({step:state.step,vendor:state.vendor,scenario:state.scenario});
  state.scenario=s;
  state.step=(s==='installed')?'warranty_installed_subpicker':'warranty_lookup';
  render();
}
window.go=go;window.back=back;window.reset=reset;window.setRole=setRole;window.setScenario=setScenario;
window.selectWarrantyVendor=id=>{state.history.push({step:state.step,vendor:state.vendor,scenario:state.scenario});state.vendor=id;state.step='warranty_vendor_detail';render();};
window.selectDelVendor=id=>{state.history.push({step:state.step,vendor:state.vendor,scenario:state.scenario});state.vendor=id;state.step='del_vendor_detail';render();};
window.selectWhVendor=id=>{state.history.push({step:state.step,vendor:state.vendor,scenario:state.scenario});state.vendor=id;state.step='wh_vendor_detail';render();};

const ROLE_LABELS={delivery:'Delivery',warehouse:'Warehouse',warranty:'Warranty',tech:'Technician'};
const SL={
  role_pick:'Home',
  del_situation:'Delivery',del_damage_found:'Damage Found',del_install:'Install As-Is',
  del_return:'Return to Warehouse',del_partsroom:'Parts Room',
  del_postinstall:'Post-Install',del_postinstall_functional:'Functional Issue',del_postinstall_cosmetic:'Cosmetic Issue',
  del_vendor_lookup:'Vendor Lookup',del_vendor_detail:'Vendor Details',
  wh_situation:'Warehouse',wh_visible:'Visible Damage',wh_concealed:'Concealed Damage',
  wh_vendor_lookup:'Vendor Lookup',wh_vendor_detail:'Vendor Details',
  tech_report:'Field Report',
  warranty_scenario:'Warranty',
  warranty_installed_subpicker:'Installed at Customer',
  warranty_lookup:'Vendor Lookup',warranty_vendor_detail:'Vendor Details'
};
function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb');
  const ri=document.getElementById('role-indicator');
  if(state.role){
    ri.textContent=ROLE_LABELS[state.role]||'';
    ri.style.color='#c9a84c';
  } else {
    ri.textContent='v2.1 · May 2026';
    ri.style.color='#8a9bb0';
  }
  let crumbs=[{label:'Home',step:'role_pick'}];
  state.history.forEach(h=>{
    if(h.step!=='role_pick'&&SL[h.step]){
      const l=SL[h.step];
      if(!crumbs.find(c=>c.label===l))crumbs.push({label:l,step:h.step});
    }
  });
  if(state.step!=='role_pick'&&SL[state.step]){
    const cur=SL[state.step];
    if(!crumbs.find(c=>c.label===cur))crumbs.push({label:cur,current:true});
    else crumbs=crumbs.map(c=>c.label===cur?{...c,current:true}:c);
  }
  el.innerHTML=crumbs.map((c,i)=>{
    const prefix=i>0?'<span class="sep">›</span>':'';
    const cls=c.current?'current':'';
    const oc=c.current||!c.step?'':('onclick="goStep(\''+c.step+'\')"');
    return prefix+'<span class="'+cls+'" '+oc+'>'+c.label+'</span>';
  }).join('');
}
function goStep(step){
  if(step==='role_pick'){reset();return;}
  const idx=state.history.findIndex(h=>h.step===step);
  if(idx>=0){
    const s=state.history[idx];
    state.history=state.history.slice(0,idx);
    state.step=s.step;state.vendor=s.vendor;state.scenario=s.scenario;render();
  }
}

      <textarea class="form-input form-textarea" id="tr-desc" placeholder="Describe the issue — what you found, what was tested, what the manufacturer rep said" oninput="techPreview()"></textarea>
      <div class="form-label">Additional Notes</div>
      <textarea class="form-input form-textarea" id="tr-notes" placeholder="Parts ordered, next steps discussed, anything warranty should know" oninput="techPreview()"></textarea>

window.techAddPhoto=function(key,input){
  if(!input.files[0])return;
  const file=input.files[0];
  techPhotos[key]=file;
  const thumbWrap=document.getElementById(`tp-thumb-${key}`);
  const btnText=document.getElementById(`tp-btn-text-${key}`);
  const slot=document.getElementById(`slot-${key}`);
  if(thumbWrap) thumbWrap.innerHTML=`<img src="${URL.createObjectURL(file)}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;margin-right:10px;flex-shrink:0">`;
  if(btnText) btnText.textContent='✓ Saved — tap to retake';
  if(slot) slot.classList.add('slot-done');
  const done=Object.values(techPhotos).filter(Boolean).length;
  const countEl=document.getElementById('tech-photo-count');
  if(countEl) countEl.textContent=`${done} of 3 photos taken${done===3?' ✓':''}`;
  const saveWrap=document.getElementById('tech-save-wrap');
  if(saveWrap) saveWrap.style.display=done>0?'block':'none';
  const saveBtn=document.getElementById('tech-save-all-btn');
  if(saveBtn){saveBtn.textContent='💾 Save All Photos to Device';saveBtn.style.background='';saveBtn.style.color='';}
  techPreview();
};

window.techSaveAll=async function(){
  const slots=TECH_PHOTO_SLOTS.filter(s=>techPhotos[s.key]);
  const files=slots.map(s=>techPhotos[s.key]);
  const btn=document.getElementById('tech-save-all-btn');
  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({files, title:'Capritta Field Report Photos'});
      if(btn){btn.textContent='✓ Saved';btn.style.background='var(--green)';btn.style.color='white';}
      return;
    }catch(e){if(e.name==='AbortError')return;}
  }
  // Fallback — download each
  slots.forEach((s,i)=>{
    const url=URL.createObjectURL(techPhotos[s.key]);
    const a=document.createElement('a');
    a.href=url;a.download=`capritta-${s.key}-${Date.now()+i}.jpg`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  if(btn){btn.textContent='✓ Saved to Files';btn.style.background='var(--green)';btn.style.color='white';}
};

window.techSavePhotos=function(){
  const slots=TECH_PHOTO_SLOTS.filter(s=>techPhotos[s.key]);
  slots.forEach((s,i)=>{
    const url=URL.createObjectURL(techPhotos[s.key]);
    const a=document.createElement('a');
    a.href=url;
    a.download=`capritta-${s.key}-${Date.now()}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  const saveBtn=document.querySelector('.photo-save-btn');
  if(saveBtn){saveBtn.textContent='✓ Photos Saved — Now Open Email';saveBtn.style.background='var(--green)';saveBtn.style.color='white';}
};

window.techPreview=function(){
  const v=id=>document.getElementById(id)?.value.trim()||'';
  const customer=v('tr-customer'),wo=v('tr-wo'),model=v('tr-model'),serial=v('tr-serial');
  const auth=v('tr-auth'),desc=v('tr-desc'),notes=v('tr-notes');
  const btn=document.getElementById('tr-send-btn');
  const wrap=document.getElementById('tr-preview-wrap');
  if(!customer||!wo||!model||!serial||!desc){if(btn)btn.disabled=true;if(wrap)wrap.style.display='none';return;}
  const done=Object.values(techPhotos).filter(Boolean).length;
  const photoStatus=TECH_PHOTO_SLOTS.map(s=>`  ${techPhotos[s.key]?'✓':'✗'} ${s.label}`).join('\n');
  const lines=[
    `FIELD SERVICE REPORT`,``,
    `Customer: ${customer}`,`Work Order #: ${wo}`,
    `Model #: ${model}`,`Serial #: ${serial}`,
    auth?`Manufacturer Auth / Case #: ${auth}`:'',
    ``,`Issue Description:`,desc,``
  ];
  if(notes) lines.push(`Additional Notes:`,notes,``);
  lines.push(
    `Photos (${done}/3):`,photoStatus,``,
    `—`,`Submitted via Capritta Service Tech Tool`
  );
  const body=lines.filter(l=>l!==null).join('\n');
  const subject=`Field Report — ${customer} — ${model}`;
  const prev=document.getElementById('tr-preview');
  if(prev) prev.textContent=body;
  if(wrap) wrap.style.display='block';
  if(btn){btn.disabled=false;btn._body=body;btn._subject=subject;}
};

window.techSend=function(){
  const btn=document.getElementById('tr-send-btn');
  const photos=TECH_PHOTO_SLOTS.map(s=>techPhotos[s.key]).filter(Boolean);
  ejsSend({
    subject: btn._subject||'Field Report',
    message: btn._body||'',
    photos,
    ccField: EMAIL_CC_TECH,
    btn,
    successMsg:'✓ Sent to Warranty'
  });
};

// ── PHOTO SAVE HELPER ──
async function savePhotoToDevice(file, filename){
  // iOS 15+ with Web Share API — saves directly to Photos via share sheet
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename});
      return 'shared';
    }catch(e){
      if(e.name==='AbortError') return 'cancelled';
      // Fall through to download
    }
  }
  // Fallback — saves to Downloads/Files
  const url=URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  return 'downloaded';
}

window.drAddPhotos=function(input){
  Array.from(input.files).forEach((file,i)=>{
    drPhotos.push(file);
  });
  drRenderThumbs();
  drPreview();
};
window.drRemovePhoto=function(i){
  drPhotos.splice(i,1);
  drRenderThumbs();
  drPreview();
};
function drRenderThumbs(){
  const row=document.getElementById('dr-thumb-row');
  const count=document.getElementById('dr-photo-count');
  const saveWrap=document.getElementById('dr-save-wrap');
  const saveBtn=document.getElementById('dr-save-all-btn');
  if(!row)return;
  row.innerHTML=drPhotos.map((f,i)=>`<div class="thumb-wrap"><img class="thumb" src="${URL.createObjectURL(f)}"><button class="thumb-del" onclick="drRemovePhoto(${i})">✕</button></div>`).join('');
  if(count)count.textContent=drPhotos.length?`${drPhotos.length} photo${drPhotos.length>1?'s':''} taken`:'';
  if(saveWrap)saveWrap.style.display=drPhotos.length>0?'block':'none';
  if(saveBtn){saveBtn.textContent='💾 Save All Photos to Device';saveBtn.style.background='';saveBtn.style.color='';}
}

};
window.drSavePhotos=function(){

    const a=document.createElement('a');
    a.href=url;a.download=`capritta-damage-${i+1}-${Date.now()}.jpg`;

window.drPreview=function(){
  const v=id=>document.getElementById(id)?.value.trim()||'';
  const customer=v('dr-customer'),wo=v('dr-wo'),model=v('dr-model'),serial=v('dr-serial');
  const received=v('dr-received'),desc=v('dr-desc'),auth=v('dr-auth'),notes=v('dr-notes');
  const btn=document.getElementById('dr-send-btn');
  const wrap=document.getElementById('dr-preview-wrap');
  if(!customer||!wo||!model||!serial||!desc){if(btn)btn.disabled=true;if(wrap)wrap.style.display='none';return;}
  const ctx=state.history[state.history.length-1];
  const ctxLabel={
    del_install:'Install As-Is (unit was installed)',del_return:'Returned to Warehouse',
    del_partsroom:'Returned for Parts Room Repair',del_postinstall_functional:'Post-Install Functional Issue',
    del_postinstall_cosmetic:'Post-Install Cosmetic Damage',wh_visible:'Warehouse — Visible Damage at Receiving',
    wh_concealed:'Warehouse — Concealed Damage'
  }[ctx&&ctx.step]||'Damage Report';
  const dateStr=received?new Date(received+'T12:00:00').toLocaleDateString('en-US'):'';
  const photoNote=drPhotos.length?`${drPhotos.length} photo${drPhotos.length>1?'s':''} attached (add to email before sending)`:'⚠ No photos added yet — please attach before sending';
  const lines=[
    `DAMAGE REPORT — ${ctxLabel.toUpperCase()}`,``,
    `Customer: ${customer}`,`Work Order #: ${wo}`,`Model #: ${model}`,`Serial #: ${serial}`,
    `Date Damage Found: ${dateStr}`,``,`Damage Description:`,desc,``
  ];
  if(auth)lines.push(`Authorized By: ${auth}`,``);
  if(notes)lines.push(`Additional Notes:`,notes,``);
  lines.push(`Photos: ${photoNote}`,``,`—`,`Submitted via Capritta Damage & Return Tool`);
  const body=lines.join('\n');
  const subject=`Damage Report — ${customer} — ${model}`;
  const prev=document.getElementById('dr-preview');
  if(prev)prev.textContent=body;
  if(wrap)wrap.style.display='block';
  if(btn){btn.disabled=false;btn._body=body;btn._subject=subject;}
};
window.drSend=function(){
  const btn=document.getElementById('dr-send-btn');
  ejsSend({
    subject: btn._subject||'Damage Report',
    message: btn._body||'',
    photos:  drPhotos,
    ccField: EMAIL_CC,
    btn,
    successMsg:'✓ Sent to Warranty'
  });
